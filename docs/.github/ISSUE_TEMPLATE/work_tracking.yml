name: Work tracking
description: >
  Track work that has already been discussed and agreed on. Not for new proposals.
labels: [tracking]
body:
  - type: markdown
    attributes:
      value: |
        This template is for work that has **already been discussed and agreed on**
        in a prior issue, discussion, or maintainer sync. It gives that work a place
        to be assigned, linked from pull requests, and closed.

        If you are proposing something new, open a [discussion](https://github.com/HarshShinde0/geocr_mcp/discussions)
        or a [bug report](https://github.com/HarshShinde0/geocr_mcp/issues) first.

  - type: input
    id: source
    attributes:
      label: Where was this agreed?
      description: >
        Link to the discussion or issue. If the agreement was in a call without a link, note where and when.
      placeholder: https://github.com/HarshShinde0/geocr_mcp/discussions/123
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: >
        Summary, task list, acceptance criteria, or open questions. Use whatever structure fits the work.
    validations:
      required: false
