# Configuration for actions/labeler
# https://github.com/actions/labeler

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "docs/docs/**"
          - "docs/**/*.mdx"
          - "docs/docs.json"

specification:
  - changed-files:
      - any-glob-to-any-file:
          - "docs/specification/**"
          - "specification/**"

server:
  - changed-files:
      - any-glob-to-any-file:
          - "src/geocr_mcp_server/**"
          - "pyproject.toml"

python:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.py"

docs-infra:
  - changed-files:
      - any-glob-to-any-file:
          - "docs/docs.json"
          - "docs/.mintlify/**"
          - "docs/snippets/**"
