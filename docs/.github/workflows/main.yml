# GeoCroissant docs validation
# Runs on pushes to main and on pull requests. Validates the Mintlify docs
# at docs/docs.json and checks that markdown links resolve.
# Hosted docs: Mintlify. Hosted MCP endpoint: https://geocr-mcp-server.onrender.com/mcp
# Local endpoint for development: http://localhost:8000/mcp

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install docs dependencies if present
        working-directory: docs
        run: |
          if [ -f package.json ]; then
            npm ci
          else
            echo "No package.json in docs, skip npm install"
          fi

      - name: Validate Mintlify docs
        working-directory: docs
        run: npx mint validate

      - name: Check docs links if configured
        working-directory: docs
        run: |
          if [ -f package.json ]; then
            npm run check:docs:links --if-present
          else
            echo "No package.json, skip link check"
          fi
