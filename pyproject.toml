[project]
name = "geocr-mcp"
version = "1.0.0"
description = "A Model Context Protocol (MCP) server for MLCommons Croissant and GeoCroissant, powered by the mlcroissant library"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mlcroissant @ git+https://github.com/HarshShinde0/croissant.git@main#subdirectory=python/mlcroissant",
    "loguru>=0.7.0",
    "mcp[cli]>=1.9.0,<2.0.0",
    "pydantic>=2.10.6",
    "pystac-client>=0.8.0",
    "pyyaml>=6.0.0",
]
authors = [
    { name = 'GeoCroissant MCP Contributors' },
]
classifiers = [
    'Operating System :: OS Independent',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
]
keywords = [
    'mcp',
    'llm',
    'agent',
    'croissant',
    'geocroissant',
    'mlcommons',
    'geospatial',
    'earth-observation',
    'ml-datasets',
]

[project.urls]
Homepage = 'https://github.com/HarshShinde0/croissant'
Documentation = 'https://github.com/HarshShinde0/croissant'
Source = 'https://github.com/HarshShinde0/croissant.git'
'Bug Tracker' = 'https://github.com/HarshShinde0/croissant/issues'

[project.scripts]
'geocr-mcp-server' = 'geocr_mcp_server.server:main'

[dependency-groups]
dev = [
    'commitizen>=4.2.2',
    'pre-commit>=4.1.0',
    'ruff>=0.9.7',
    'pyright>=1.1.398',
    'pytest>=8.0.0',
    'pytest-cov>=4.1.0',
    'pytest-mock>=3.12.0',
    'pytest-asyncio>=0.26.0',
]

[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ['src/geocr_mcp_server']

[tool.ruff]
line-length = 99
extend-include = ['*.ipynb']
exclude = [
    '.venv',
    '**/__pycache__',
    '**/node_modules',
    '**/dist',
    '**/build',
    '**/env',
    '**/.ruff_cache',
    '**/.venv',
    '**/.ipynb_checkpoints',
]
force-exclude = true

[tool.ruff.lint]
exclude = ['__init__.py']
select = ['C', 'D', 'E', 'F', 'I', 'W']
ignore = ['C901', 'E501', 'E741', 'F402', 'F823', 'D100', 'D106']

[tool.ruff.lint.isort]
lines-after-imports = 2
no-sections = true

[tool.ruff.lint.per-file-ignores]
'**/*.ipynb' = ['F704']
'tests/**' = ['D103', 'D101', 'D102', 'D107']

[tool.ruff.lint.pydocstyle]
convention = 'google'

[tool.ruff.format]
quote-style = 'single'
indent-style = 'space'
skip-magic-trailing-comma = false
line-ending = 'auto'
docstring-code-format = true

[tool.pyright]
include = ['src', 'tests']
exclude = ['**/__pycache__', '**/.venv', '**/node_modules', '**/dist', '**/build']

[tool.commitizen]
name = 'cz_conventional_commits'
    version = '1.0.0'
tag_format = 'v$version'
version_files = [
    'pyproject.toml:version',
    'src/geocr_mcp_server/__init__.py:__version__',
]
update_changelog_on_bump = true

[tool.bandit]
exclude_dirs = ['.venv', 'venv', 'tests']

[tool.pytest.ini_options]
python_files = 'test_*.py'
python_classes = 'Test*'
python_functions = 'test_*'
testpaths = ['tests']
asyncio_mode = 'auto'
markers = [
    'live: marks tests that make live network calls (deselect with "-m \"not live\"")',
]

[tool.coverage.report]
exclude_also = [
    'pragma: no cover',
    'if __name__ == .__main__.:\n    main()',
]

[tool.coverage.run]
source = ['geocr_mcp_server']
