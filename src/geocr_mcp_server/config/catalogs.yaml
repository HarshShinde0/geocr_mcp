# STAC catalog registry for the geocr MCP server.
#
# This file is shipped as package data and loaded on first registry access by
# ``geocr_mcp_server.catalogs``. Point ``GEOCR_CATALOGS_CONFIG`` at a copy of
# this file to register catalogs and informational collection snapshots
# without changing code.
# Registered STAC catalogs, keyed by a short lowercase id.
default_catalog: earth-search
#
# Collection ids below were audited against the live API on 2026-08-23:
# GET https://earth-search.aws.element84.com/v1/collections returns exactly
# nine collections - sentinel-2-c1-l2a, sentinel-2-l2a, sentinel-2-l1c,
# sentinel-2-pre-c1-l2a, landsat-c2-l2, sentinel-1-grd, cop-dem-glo-30,
# cop-dem-glo-90 and naip.
catalogs:
  earth-search:
    name: Earth Search (Element84 / AWS Open Data)
    url: https://earth-search.aws.element84.com/v1
    description: >-
      STAC API over AWS Open Data EO assets. Collections: sentinel-2-c1-l2a,
      sentinel-2-l2a, sentinel-2-l1c, sentinel-2-pre-c1-l2a, landsat-c2-l2,
      sentinel-1-grd, cop-dem-glo-30, cop-dem-glo-90, naip.
    collections:
      - sentinel-2-c1-l2a
      - sentinel-2-l2a
      - sentinel-2-l1c
      - sentinel-2-pre-c1-l2a
      - landsat-c2-l2
      - sentinel-1-grd
      - cop-dem-glo-30
      - cop-dem-glo-90
      - naip

  veda:
    name: NASA VEDA
    url: https://openveda.cloud/api/stac
    description: >-
      NASA Visualization, Exploration, and Data Analysis (VEDA) thematic
      Earth science catalog. All live collections remain discoverable.
    # Informational collection snapshot. Live discovery can find additions
    # before this list is refreshed.
